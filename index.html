<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>The Dark Pictures – Interactive Horror</title>

<style>
body {
  background: #000;
  color: #ddd;
  font-family: Georgia, serif;
  padding: 40px;
  margin: 0;
}
#content {
  max-width: 900px;
  margin: auto;
  position: relative;
}
h1, h2 {
  font-weight: normal;
  letter-spacing: 1px;
}
button {
  display: block;
  margin: 12px 0;
  padding: 12px;
  width: 100%;
  background: #111;
  color: #eee;
  border: 1px solid #444;
  cursor: pointer;
  font-size: 16px;
}
button:hover {
  background: #222;
}
.small {
  font-size: 0.9em;
  color: #aaa;
}
.qte {
  position: absolute;
  width: 42px;
  height: 42px;
  background: darkred;
  border-radius: 50%;
  cursor: pointer;
}
.fade {
  animation: fade 0.5s;
}
@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>
<div id="content"></div>

<script>
/* =====================================================
   ÉTAT GLOBAL DU JEU
   ===================================================== */
let state = {
  character: null,
  scene: "menu",
  alive: true,
  flags: {},
  log: ""
};

/* =====================================================
   AUDIO
   ===================================================== */
const music = new Audio("audio/ambiance.mp3");
music.loop = true;
music.volume = 0.4;

const qteSound = new Audio("audio/qte.mp3");
qteSound.volume = 0.9;

function startMusic() {
  if (music.paused) {
    music.play().catch(()=>{});
  }
}

/* =====================================================
   OUTILS D’AFFICHAGE
   ===================================================== */
function show(html) {
  const c = document.getElementById("content");
  c.innerHTML = html;
  c.classList.remove("fade");
  void c.offsetWidth;
  c.classList.add("fade");
}

function go(scene) {
  state.scene = scene;
  play();
}

/* =====================================================
   MENU PRINCIPAL
   ===================================================== */
function menu() {
  show(`
    <h1>The Dark Pictures</h1>
    <p class="small">Choisissez un personnage</p>

    <button onclick="startCharacter('conrad')">
      Conrad – Man of Medan
    </button>

    <button onclick="startCharacter('andrew')">
      Andrew – Little Hope
    </button>

    <button onclick="startCharacter('rachel')">
      Rachel – House of Ashes
    </button>

    <button onclick="startCharacter('kate')">
      Kate – The Devil In Me
    </button>
  `);
}

/* =====================================================
   DÉMARRAGE D’UN PERSONNAGE
   ===================================================== */
function startCharacter(char) {
  startMusic();
  state.character = char;
  state.scene = "intro";
  state.alive = true;
  state.flags = {};
  state.log = "";
  play();
}

/* =====================================================
   QTE SOURIS (ALÉATOIRE)
   ===================================================== */
function qte(success, fail, time = 1200) {
  qteSound.currentTime = 0;
  qteSound.play();

  const size = 42;
  const x = Math.random() * (window.innerWidth - size);
  const y = Math.random() * (window.innerHeight - size);

  show(`
    <p>AGIS VITE</p>
    <div class="qte"
      style="left:${x}px; top:${y}px"
      onclick="go('${success}')">
    </div>
  `);

  setTimeout(() => {
    if (state.scene !== success) {
      go(fail);
    }
  }, time);
}

/* =====================================================
   MORT
   ===================================================== */
function die(reason) {
  state.alive = false;
  show(`
    <h2>PERSONNAGE DÉCÉDÉ</h2>
    <p>${reason}</p>
    <p class="small">
      Le Conservateur referme lentement son livre.
    </p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

/* =====================================================
   CERVEAU DU JEU
   ===================================================== */
function play() {
  if (!state.alive) return;

  if (state.scene === "menu") {
    menu();
    return;
  }

  switch (state.character) {
    case "conrad":
      playConrad();
      break;
    case "andrew":
      playAndrew();
      break;
    case "rachel":
      playRachel();
      break;
    case "kate":
      playKate();
      break;
  }
}

/* =====================================================
   PLACEHOLDERS DES HISTOIRES
   (LES VRAIES HISTOIRES SERONT COLLÉES ICI PLUS TARD)
   ===================================================== */

function playConrad() {
  show(`
    <h2>Conrad – Man of Medan</h2>
    <p>Histoire à venir.</p>
    <p class="small">
      (Le moteur fonctionne. L’histoire sera ajoutée ici.)
    </p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

function playAndrew() {
  show(`
    <h2>Andrew – Little Hope</h2>
    <p>Histoire à venir.</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

function playRachel() {
  show(`
    <h2>Rachel – House of Ashes</h2>
    <p>Histoire à venir.</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

function playKate() {
  show(`
    <h2>Kate – The Devil In Me</h2>
    <p>Histoire à venir.</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

/* =====================================================
   LANCEMENT
   ===================================================== */
menu();
</script>
</body>
</html>
