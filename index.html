<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>The Dark Pictures</title>
<style>
body {
  background:black;
  color:#ddd;
  font-family:Georgia, serif;
  padding:40px;
}
#content { max-width:800px; margin:auto; }
button {
  display:block;
  margin:10px 0;
  padding:10px;
  background:#111;
  color:#eee;
  border:1px solid #444;
  cursor:pointer;
}
button:hover { background:#333; }
.qte {
  width:40px;
  height:40px;
  background:red;
  border-radius:50%;
  position:absolute;
  cursor:pointer;
}
</style>
</head>

<body>
<div id="content"></div>

<script>
// ======================
// ÉTAT DU JEU
// ======================
let state = {
  character: null,
  scene: "menu",
  alive: true,
  flags: {
    juliaTrust: 0,
    blessure: false
  }
};

// ======================
// OUTILS
// ======================
function show(html) {
  document.getElementById("content").innerHTML = html;
}

function next(scene) {
  state.scene = scene;
  play();
}

// ======================
// MENU
// ======================
function menu() {
  show(`
    <h1>The Dark Pictures</h1>
    <button onclick="start('conrad')">Conrad – Man of Medan</button>
    <button onclick="alert('À venir')">Andrew</button>
    <button onclick="alert('À venir')">Rachel</button>
    <button onclick="alert('À venir')">Kate</button>
  `);
}

function start(char) {
  state.character = char;
  state.scene = "intro";
  state.alive = true;
  state.flags = { juliaTrust:0, blessure:false };
  play();
}

// ======================
// QTE SOURIS
// ======================
function qte(success, fail) {
  const size = 40;
  const x = Math.random() * (window.innerWidth - size);
  const y = Math.random() * (window.innerHeight - size);

  show(`<p>AGIS !</p>
    <div class="qte" style="left:${x}px;top:${y}px"
    onclick="next('${success}')"></div>`);

  setTimeout(() => {
    if (state.scene !== success) next(fail);
  }, 1200);
}

// ======================
// MORT
// ======================
function die(text) {
  state.alive = false;
  show(`
    <h2>CONRAD EST MORT</h2>
    <p>${text}</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

// ======================
// JEU
// ======================
function play() {
  if (!state.alive) return;

  if (state.scene === "menu") {
    menu();
    return;
  }

  if (state.character === "conrad") {
    playConrad();
    return;
  }
}

// ======================
// CONRAD — BASE SOLIDE
// ======================
function playConrad() {

  switch(state.scene) {

    case "intro":
      show(`
        <p><em>Le Conservateur :</em><br>
        "L’arrogance est parfois un masque pour la peur."</p>
        <button onclick="next('plongee')">Continuer</button>
      `);
    break;

    case "plongee":
      show(`
        <p>L’épave repose sous la surface.
        Le silence est oppressant.</p>
        <button onclick="next('dialogue')">Descendre</button>
      `);
    break;

    case "dialogue":
      show(`
        <p><strong>Julia :</strong> "Tu es sûr de toi ?"</p>
        <button onclick="state.flags.juliaTrust++; next('epave')">
          "Fais-moi confiance"
        </button>
        <button onclick="next('epave')">
          "On n’a pas le choix"
        </button>
      `);
    break;

    case "epave":
      show(`
        <p>Le métal gémit sous tes pas.</p>
        <button onclick="qte('reussi','mort_chute')">
          Traverser
        </button>
      `);
    break;

    case "reussi":
      state.flags.blessure = true;
      show(`
        <p>Tu passes, mais ta jambe heurte le métal.</p>
        <button onclick="next('suite')">Continuer</button>
      `);
    break;

    case "suite":
      show(`
        <p>Des voix résonnent. Les pirates.</p>
        <button onclick="qte('survie','mort_balle')">
          Fuir
        </button>
      `);
    break;

    case "survie":
      show(`
        <h2>CONRAD SURVIT</h2>
        <p>Le jour se lève sur la mer.</p>
        <button onclick="state.scene='menu';menu()">Menu</button>
      `);
    break;

    case "mort_chute":
      die("La passerelle s’est effondrée sous son poids.");
    break;

    case "mort_balle":
      die("Le tir a été fatal.");
    break;
  }
}

// ======================
menu();
</script>
</body>
</html>
