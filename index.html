<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>The Dark Fritures Anthology (inspiré de Supermassive Games)</title>

<style>
body {
  background:black;
  color:#ddd;
  font-family:Georgia, serif;
  padding:40px;
  margin:0;
}
#content {
  max-width:900px;
  margin:auto;
  position:relative;
}
button {
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  background:#111;
  color:#eee;
  border:1px solid #444;
  cursor:pointer;
}
button:hover { background:#222; }
.small { color:#aaa; font-size:0.9em; }

.qte {
  position:absolute;
  width:40px;
  height:40px;
  background:darkred;
  border-radius:50%;
  cursor:pointer;
}
</style>
</head>

<body>
<div id="content"></div>

<script>
// =====================
// ÉTAT DU JEU
// =====================
let state = {
  character: null,
  scene: "menu",
  alive: true,
  flags: {},
  log: ""
};

// =====================
// AUDIO
// =====================
const music = new Audio("audio/ambiance.mp3");
music.loop = true;
music.volume = 0.4;

const qteSound = new Audio("audio/qte.mp3");
qteSound.volume = 0.8;

function startMusic() {
  if (music.paused) {
    music.play().catch(()=>{});
  }
}

// =====================
// OUTILS
// =====================
function show(html) {
  document.getElementById("content").innerHTML = html;
}

function go(scene) {
  state.scene = scene;
  play();
}

// =====================
// MENU
// =====================
function menu() {
  show(`
    <h1>Inspiré de l'Univers de Supermassive Games : The Dark Fritures Anthology</h1>
    <button onclick="startCharacter('conrad')">Conrad – Man of Medan (Niv 1)</button>
    <button onclick="startCharacter('andrew')">Andrew – Little Hope (Niv2)</button>
    <button onclick="startCharacter('rachel')">Rachel – House of Ashes (Niv3)</button>
    <button onclick="startCharacter('kate')">Kate – The Devil In Me (Niv4)</button>
  `);
}

function startCharacter(char) {
  startMusic();
  state.character = char;
  state.scene = "intro";
  state.alive = true;
  state.flags = {};
  state.log = "";
  play();
}

// =====================
// QTE SOURIS
// =====================
function qte(success, fail, time = 1200) {
  qteSound.currentTime = 0;
  qteSound.play();

  const size = 40;
  const x = Math.random() * (window.innerWidth - size);
  const y = Math.random() * (window.innerHeight - size);

  show(`
    <p>AGIS VITE</p>
    <div class="qte"
      style="left:${x}px; top:${y}px"
      onclick="go('${success}')">
    </div>
  `);

  setTimeout(() => {
    if (state.scene !== success) {
      go(fail);
    }
  }, time);
}

// =====================
// MORT
// =====================
function die(reason) {
  state.alive = false;
  show(`
    <h2>PERSONNAGE DÉCÉDÉ</h2>
    <p>${reason}</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

// =====================
// CERVEAU DU JEU
// =====================
function play() {
  if (!state.alive) return;

  if (state.scene === "menu") {
    menu();
    return;
  }

  if (state.character === "conrad") playConrad();
  if (state.character === "andrew") playAndrew();
  if (state.character === "rachel") playRachel();
  if (state.character === "kate") playKate();
}

// =====================
// HISTOIRES (PLACEHOLDERS)
// =====================
function playConrad() {

  /* ===== SCÈNE : LE CONSERVATEUR ===== */
  if (state.scene === "intro") {
    show(`
      <h2>Le Conservateur</h2>
      <p>
        Une pièce hors du temps. Des étagères infinies, des livres reliés de cuir,
        l’odeur de la poussière et de l’encre ancienne.
      </p>
      <p>
        Un homme élégant referme lentement un ouvrage.
      </p>
      <p><em>
        « Bonjour, je suis le conservateur, gardien des récits. Je suis là pour noter tout ce que vous faites. Vous avez choisi ?
        Ah… Conrad.  
        Un jeune homme persuadé que le danger n’est qu’un jeu.
        Voyons si vous saurez tourner les pages… sans les déchirer. »
      </em></p>
      <button onclick="go('boat_intro')">Continuer</button>
    `);
    return;
  }

  /* ===== SCÈNE : LE BATEAU ===== */
  if (state.scene === "boat_intro") {
    show(`
      <h2>Océan Pacifique</h2>
      <p>
        Le soleil écrase la surface de l’eau.  
        Le bateau tangue doucement.
      </p>
      <p>
        Conrad s’appuie contre le bastingage, lunettes de soleil sur le nez,
        un sourire arrogant aux lèvres.
      </p>
      <p>
        Julia, sa soeur rit quelque part derrière lui.  
        Fliss, la capitaine du petit bateau de plongé tient la barre.  
        Alex, le petit copain de Julia vérifie son équipement de plongée.
      </p>
      <p>
        Tout semble… normal.
      </p>

      <button onclick="go('dialogue_julia')">
        Se moquer de Julia
      </button>

      <button onclick="go('dialogue_fliss')">
        Parler à Fliss
      </button>
    `);
    return;
  }

  /* ===== DIALOGUE JULIA ===== */
  if (state.scene === "dialogue_julia") {
    state.flags.taquin = true;
    show(`
      <p>
        « Sérieusement Julia, tu comptes plonger avec ÇA ? C'est aussi safe que d'aller dans un temple maudit en Irak en 2003 ! »
      </p>
      <p>
        Elle lève les yeux au ciel, mais sourit. "Tu peux arrêter de te comporter comme ça ? Va plutôt draguer Fliss comme tu le fait si... Bien ?
      </p>
      <p class="small">
        Votre légèreté masque une certaine nervosité.
      </p>
      <button onclick="go('ombre_sous_leau')">Continuer</button>
    `);
    return;
  }

  /* ===== DIALOGUE FLISS ===== */
  if (state.scene === "dialogue_fliss") {
    state.flags.respectFliss = true;
    show(`
      <p>
        Fliss vous lance un regard méfiant.
      </p>
      <p>
        « Ce coin est dangereux. On n'essai même pas de me draguer ici. »
      </p>
      <p>
        Pour une fois, Conrad se tait.
      </p>
      <button onclick="go('ombre_sous_leau')">Continuer</button>
    `);
    return;
  }

  /* ===== PRÉFIGURATION HORREUR ===== */
  if (state.scene === "ombre_sous_leau") {
    show(`
      <p>
        Sous la surface, quelque chose bouge.
      </p>
      <p>
        Une ombre… trop grande pour être un simple poisson.
      </p>
      <p>
        Conrad sent un frisson lui parcourir l’échine.
      </p>
      <button onclick="go('qte_equilibre')">
        Se pencher pour mieux voir
      </button>
    `);
    return;
  }

  /* ===== QTE ===== */
  if (state.scene === "qte_equilibre") {
    qte("reussi_equilibre", "rate_equilibre", 1500);
    state.scene = "attente_qte";
    return;
  }

  if (state.scene === "reussi_equilibre") {
    show(`
      <p>
        Conrad se rattrape de justesse.
      </p>
      <p>
        L’ombre disparaît.
      </p>
      <button onclick="go('calme_trompeur')">Continuer</button>
    `);
    return;
  }

  if (state.scene === "rate_equilibre") {
    die(`
      Conrad bascule par-dessus bord.
      Personne ne le voit sombrer tandis qu'un requin étrange se jette sur lui.
      Le silence de l’océan pourpre de sang devient sa tombe.
    `);
    return;
  }

  /* ===== CALME AVANT LA TEMPÊTE ===== */
  if (state.scene === "calme_trompeur") {
    show(`
      <p>
        Le rire revient sur le bateau.
      </p>
      <p>
        Mais quelque part…  
        quelque chose a remarqué leur présence.
      </p>
      <p class="small">
        Le Conservateur tourne une page.
      </p>
      <button onclick="go('conservateur')">Continuer</button>
      `);
    return;
  }

  /* ================= CONSERVATEUR ================= */
  if (state.scene === "conservateur") {
    show(`
      <h2>Le Conservateur</h2>
      <p>
        « Nous avons déjà tourné quelques pages…  
        Mais parfois, le plus dangereux n’est pas ce que l’on voit.
        C’est ce que l’on croit voir. »
      </p>
      <button onclick="go('approche_bateau')">Continuer</button>
    `);
    return;
  }

  /* ================= APPROCHE DU BATEAU ================= */
  if (state.scene === "approche_bateau") {
    show(`
      <p>
        Un bruit de moteur brise le calme.
      </p>
      <p>
        Un autre bateau approche. Trop vite. Trop près. Les deux bateau se heurtent !
      </p>
      <p>
        Fliss se crispe.
      </p>
      <p><em>
        « Conrad… reste calme. C'est pas des gardes cotes. »
      </em></p>

      <button onclick="go('provoquer')">Provoquer les inconnus</button>
      <button onclick="go('se_taire')">Se taire</button>
    `);
    return;
  }

  /* ================= CHOIX ================= */
  if (state.scene === "provoquer") {
    state.flags.provocateur = true;
    show(`
      <p>
        Conrad sourit, ironique. Hé ! Vous êtes complètement bourrés ou quoi ?
      </p>
      <p>
        Mauvaise idée.
      </p>
      <button onclick="go('menace')">Continuer</button>
    `);
    return;
  }

  if (state.scene === "se_taire") {
    state.flags.calme = true;
    show(`
      <p>
        Le silence pèse.
      </p>
      <p>
        Trois hommes armés montent à bord.
      </p>
      <button onclick="go('menace')">Continuer</button>
    `);
    return;
  }

  /* ================= MENACE ================= */
  if (state.scene === "menace") {
    show(`
      <p>
        Olson, le capitaine des trois, pointe un revolver sur Alex.
      </p>
      <p>
        Conrad sent son cœur battre à tout rompre. "Putain ! qu'est-ce que vous faites ?!"
      </p>
      <button onclick="go('qte_fuite')">
        Tenter de s’enfuir
      </button>
    `);
    return;
  }

  /* ================= QTE ================= */
  if (state.scene === "qte_fuite") {
    qte("fuite_reussie", "fuite_ratee", 1500);
    return;
  }

  if (state.scene === "fuite_ratee") {
    die(`
      Conrad trébuche.
      Un coup de feu retentit.
      Sa bravade lui coûte la vie.
    `);
    return;
  }

  if (state.scene === "fuite_reussie") {
    show(`
      <p>
        Conrad est capturé juste avant d'avoir pu s'échapper.
        Olson - "Reste avec les autres ! Junior, va l'attacher avec les autres."
        Junior, le plus jeunes des trois pirates, emmène Conrad et Alex. Pendant ce temps, Danny, le plus modéré des trois pirates s'occupe de Julia et Fliss
      </p>
      <p>
        Le bateau s’éloigne.
      </p>
      <p class="small">
        Survivre… pour l’instant.
      </p>
      <button onclick="go('capture')">Continuer</button>
    `);
    return;
  }

  /* ===== CAPTURE PAR LES PIRATES ===== */
  if (state.scene === "capture") {
    show(`
      <h2>Le Cargo</h2>
      <p>
        Le sac est arraché de sa tête.
        Une odeur de rouille et de pétrole lui brûle les narines.
      </p>
      <p>
        Autour de lui, Julia gémit.
        Alex est maintenu à genoux.
        Fliss fixe le sol, mâchoires serrées.
      </p>
      <p>
        Conrad comprend : ce n’est pas un simple vol.
      </p>

      <button onclick="go('dialogue_pirate')">
        Répondre avec sarcasme
      </button>

      <button onclick="go('observer_silence')">
        Se taire et observer
      </button>
    `);
    return;
  }

  /* ===== DIALOGUE PIRATE ===== */
  if (state.scene === "dialogue_pirate") {
    state.flags.provoquePirates = true;
    show(`
      <p>
        « Sérieusement ? Vous volez des touristes ? Vous pouvez pas vous trouver un job, comme tout le monde ?
        Je vous préviens, je suis citoyen américain ! Trump va vous balancer la bombe atomique en pleine gueule ! »
      </p>
      <p>
        Junior le frappe sans hésiter.
      </p>
      <p class="small">
        Mauvais souvenir. Mauvais choix. "Ta gueule !"
      </p>
      <button onclick="go('menace_arme')">Continuer</button>
    `);
    return;
  }

  /* ===== OBSERVATION ===== */
  if (state.scene === "observer_silence") {
    state.flags.calme = true;
    show(`
      <p>
        Conrad baisse les yeux.
      </p>
      <p>
        Il repère les mouvements, la seule arme des pirates : le pistolet d'Olson,
        la passerelle menant au pont inférieur. Julia semble au bord des larmes pendant que Fliss garde son sang froid.
      </p>
      <button onclick="go('menace_arme')">Continuer</button>
    `);
    return;
  }

  /* ===== MENACE ===== */
  if (state.scene === "menace_arme") {
    show(`
      <p>
        Le chef pirate appuie le canon de son arme sur la tempe d’Alex.
        Olson - "Si vous continuer, je tire !"
      </p>
      <p>
        Conrad sent la panique monter.
      </p>

      <button onclick="go('qte_intervention')">
        Intervenir
      </button>

      <button onclick="go('laisser_faire')">
        Ne rien faire
      </button>
    `);
    return;
  }

  /* ===== CHOIX CRUCIAL ===== */
  if (state.scene === "laisser_faire") {
    state.flags.culpabilite = true;
    show(`
      <p>
        Le coup part.
      </p>
      <p>
        Alex s’effondre, blessé mais vivant.
      </p>
      <p class="small">
        Cette image hantera Conrad.
      </p>
      <button onclick="go('cargo_exploration')">Continuer</button>
    `);
    return;
  }

  if (state.scene === "qte_intervention") {
    qte("intervention_reussie", "intervention_ratee", 1500);
    return;
  }

  if (state.scene === "intervention_ratee") {
    die(`
      Conrad se jette en avant.
      Trop lent.
      Le coup est mortel.
      L’héroïsme n’efface pas l’imprudence.
    `);
    return;
  }

  if (state.scene === "intervention_reussie") {
    state.flags.heros = true;
    show(`
      <p>
        Conrad désarme le pirate. Mais Junior se jette sur Conrad et le désarme à son tour.
      </p>
      <p>
        Le chaos éclate jusqu'à ce que Danny remonte de la cale du bateau de Fliss avec un papier
        Danny - "Olson ! J'ai trouver un vieux papier avec des coordonnées et un truc marqué "l'or de Manchouries" caché sous le plancher de la cale !
        On doit y aller !"
        Fliss semble surprise, elle n'avait jamais vu ce papier avant.
      </p>
      <button onclick="go('cargo_exploration')">Continuer</button>
    `);
    return;
  }

  /* ===== EXPLORATION DU CARGO ===== */
  if (state.scene === "cargo_exploration") {
    show(`
      <p>
        Le groupe dirigé par Olson guida le bateau de Fliss jusqu'au lieu des coordonnées du papier et trouva un immnse cargo abandonné de la seconde guerre.
        Olson ordonne à Danny et Junior de faire monter tout le monde dans le cargo.
        Les couloirs du cargo sont sombres.
      </p>
      <p>
        Des bruits résonnent…
        ou peut-être est-ce seulement dans la tête de Conrad ? Conrad se retrouve seul. Tout le monde a disparu...
      </p>

      <button onclick="go('suivre_bruit')">
        Suivre le bruit
      </button>

      <button onclick="go('retrouver_fliss')">
        Rejoindre les autres
      </button>
          `);
    return;
  }
  /* ===== HALLUCINATIONS ===== */
  if (state.scene === "suivre_bruit") {
    show(`
      <p>
        Conrad avance seul.
      </p>
      <p>
        Le bruit devient un murmure.
        Une voix familière.
      </p>
      <p>
        « Conrad… »
      </p>
      <p>
        Julia ?
      </p>

      <button onclick="go('hallucination_julia')">
        Répondre
      </button>

      <button onclick="go('retrouver_fliss')">
        Ignorer la voix
      </button>
    `);
    return;
  }

  if (state.scene === "hallucination_julia") {
    state.flags.hallucinations = true;
    show(`
      <p>
        Julia apparaît devant lui.
        Immobile.
      </p>
      <p>
        Son sourire est étrange.
      </p>
      <p>
        Elle ouvre la bouche.
      </p>
      <p>
        Un cri inhumain en jaillit.
      </p>
      <button onclick="go('qte_recul')">Reculer</button>
    `);
    return;
  }

  if (state.scene === "qte_recul") {
    qte("recul_ok", "recul_rate", 1500);
    return;
  }

  if (state.scene === "recul_rate") {
    die(`
      Conrad reste figé.
      La créature se jette sur lui.
      La peur l’emporte sur la raison.
    `);
    return;
  }

  if (state.scene === "recul_ok") {
    show(`
      <p>
        L’apparition se dissout.
      </p>
      <p>
        Conrad halète.
        Sa tête lui fait mal.
      </p>
      <p class="small">
        Ce qu’il a vu… était-ce réel ?
      </p>
      <button onclick="go('retrouver_fliss')">Continuer</button>
    `);
    return;
  }

  /* ===== CONSÉQUENCES ===== */
  if (state.scene === "retrouver_fliss") {
    show(`
      <p>
        Fliss surgit de l’ombre.
      </p>
      <p>
        « Conrad ! Tu vas bien ? Oû sont passés les autres ? »
      </p>

      <button onclick="go('avouer')">
        Lui dire ce que tu as vu
      </button>

      <button onclick="go('mentir')">
        Mentir
      </button>
    `);
    return;
  }

  if (state.scene === "avouer") {
    state.flags.mental_fragile = true;
    show(`
      <p>
        Fliss fronce les sourcils.
      </p>
      <p>
        « Ce bateau nous fait perdre la tête alors arrête de déconner et aide moi à retrouver Julia et Alex. On doit partir avant que les pirates ne nous retrouves ! »
      </p>
      <p class="small">
        Votre lucidité est remise en question.
      </p>
      <button onclick="go('chapitre_suivant')">Continuer</button>
    `);
    return;
  }

  if (state.scene === "mentir") {
    show(`
      <p>
        « Rien. Juste mon imagination. »
      </p>
      <p>
        Fliss hoche la tête… sans te croire.
      </p>
      <button onclick="go('chapitre_suivant')">Continuer</button>
    `);
    return;
  }

  /* ===== FIN DE CHAPITRE ===== */
  if (state.scene === "chapitre_suivant") {
    show(`
      <p>
        Plus loin dans le cargo,
        quelque chose vous observe.
      </p>
      <p class="small">
        Le Conservateur note quelque chose dans son livre.
        "Voilà ! Fin de l'acte 1. Vous pensez pouvoir tenir jusquà l'acte 3 ? Laissez-moi en douter.
        Que pensez-vous de notre intriguante Fliss ? Est-ce qu'elle vous aime secrètement ou vous déteste ?
        Sans compter tous nos disparus. Arriverez-vous à les retrouver... vivant ?"
      </p>
      <button onclick="go('rejoindre_famille')">Continuer</button>
    `);
    return;
  }
    /* ===== COULOIR DU CARGO ===== */
  if (state.scene === "rejoindre_famille") {
    show(`
      <p>
        Conrad et Fliss rejoignent Julia.
      </p>
      <p>
        Les couloirs métalliques grincent à chaque pas.
        Une odeur de moisissure flotte dans l’air.
      </p>
      <p>
        Julia chuchote :
        « J’ai cru voir quelqu’un… »
      </p>

      <button onclick="go('rassurer_julia')">
        Rassurer Julia
      </button>

      <button onclick="go('se_moquer_peur')">
        Se moquer
      </button>
    `);
    return;
  }

  /* ===== DIALOGUE JULIA ===== */
  if (state.scene === "rassurer_julia") {
    state.flags.protecteur = true;
    show(`
      <p>
        Conrad pose une main sur son épaule.
      </p>
      <p>
        « On reste ensemble. Rien ne nous arrivera. »
      </p>
      <p class="small">
        Julia vous fera davantage confiance.
      </p>
      <button onclick="go('bruit_soudain')">Continuer</button>
    `);
    return;
  }

  if (state.scene === "se_moquer_peur") {
    state.flags.insensible = true;
    show(`
      <p>
        « Sérieusement ? Tu paniques pour des bruits ? La chose la plus flipante ici, c'est le tétanos et l'humeur de l'autre taré de pirate. »
      </p>
      <p>
        Julia se ferme immédiatement.
      </p>
      <button onclick="go('bruit_soudain')">Continuer</button>
    `);
    return;
  }

  /* ===== PEUR ===== */
  if (state.scene === "bruit_soudain") {
    show(`
      <p>
        Un fracas résonne derrière eux.
      </p>
      <p>
        Une silhouette traverse le couloir. Une femme dans un costume de matelot de la seconde guerre prenant des poses provocantes
      </p>

      <button onclick="go('qte_poursuite')">
        Courir après
      </button>

      <button onclick="go('rester_groupe')">
        Rester avec le groupe
      </button>
    `);
    return;
  }

  if (state.scene === "qte_poursuite") {
    qte("poursuite_ok", "poursuite_rate", 1500);
    return;
  }

  if (state.scene === "poursuite_rate") {
    die(`
      Conrad glisse sur le sol humide.
      La silhouette se retourne.
      Cette fois, elle est bien réelle.
      Mais ce n'est pas une femme mais Olson qui s'avance vers lui avec une masse et les yeux rouges sang. C'est terminé.
    `);
    return;
  }

  if (state.scene === "poursuite_ok") {
    show(`
      <p>
        Conrad atteint le coin du couloir.
      </p>
      <p>
        Il n’y a rien.
      </p>
      <p class="small">
        Était-ce seulement une hallucination ?
      </p>
      <button onclick="go('decision_leader')">Continuer</button>
    `);
    return;
  }

  if (state.scene === "rester_groupe") {
    show(`
      <p>
        Conrad serre les poings.
      </p>
      <p>
        Personne ne se sépare.
      </p>

 <button onclick="go('conflit_suite')">

    </button>

/* ===== UNITÉ : ATTAQUE DANS LES RUINES ===== */

}

if (state.scene === "conflit_apres_mort") {

}

}

    <button onclick="go('desespoir_apres')">

if (state.scene === "fuite_reussie") {

}

if (state.scene === "desespoir_apres") {

}
if (state.scene === "branche_finale_unite") {

      <p>

    </p>
    <p>

    </p>

    <p class="small">
      Tous n’ont pas survécu.
      Mais l’humanité, oui.
    </p>

    <button onclick="go('menu')">
      Retour au menu
    </button>
  `);
  return;
}
if (state.scene === "branche_finale_conflit") {

  if (!state.flags.jason_vivant || !state.flags.nick_vivant) {

      </p>

      </p>

      <button onclick="go('menu')">
        Retour au menu
      </button>
    `);
    return;
  }

  /* 🔴 FIN SOMBRE */
  show(`

    </p>
    <p>

}
if (state.scene === "branche_finale_desespoir") {

      </p>
      <p>

      </p>

      </button>

  if (state.flags.sacrifice) {
    show(`

function playKate() {

  if (state.scene === "intro") {
