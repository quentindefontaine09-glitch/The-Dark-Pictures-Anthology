<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>The Dark Pictures</title>

<style>
body {
  background:black;
  color:#ddd;
  font-family:Georgia, serif;
  padding:40px;
  margin:0;
}
#content {
  max-width:900px;
  margin:auto;
  position:relative;
}
button {
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  background:#111;
  color:#eee;
  border:1px solid #444;
  cursor:pointer;
}
button:hover { background:#222; }
.small { color:#aaa; font-size:0.9em; }

.qte {
  position:absolute;
  width:40px;
  height:40px;
  background:darkred;
  border-radius:50%;
  cursor:pointer;
}
</style>
</head>

<body>
<div id="content"></div>

<script>
// =====================
// ÉTAT DU JEU
// =====================
let state = {
  character: null,
  scene: "menu",
  alive: true,
  flags: {},
  log: ""
};

// =====================
// AUDIO
// =====================
const music = new Audio("audio/ambiance.mp3");
music.loop = true;
music.volume = 0.4;

const qteSound = new Audio("audio/qte.mp3");
qteSound.volume = 0.8;

function startMusic() {
  if (music.paused) {
    music.play().catch(()=>{});
  }
}

// =====================
// OUTILS
// =====================
function show(html) {
  document.getElementById("content").innerHTML = html;
}

function go(scene) {
  state.scene = scene;
  play();
}

// =====================
// MENU
// =====================
function menu() {
  show(`
    <h1>The Dark Pictures</h1>
    <button onclick="startCharacter('conrad')">Conrad – Man of Medan</button>
    <button onclick="startCharacter('andrew')">Andrew – Little Hope</button>
    <button onclick="startCharacter('rachel')">Rachel – House of Ashes</button>
    <button onclick="startCharacter('kate')">Kate – The Devil In Me</button>
  `);
}

function startCharacter(char) {
  startMusic();
  state.character = char;
  state.scene = "intro";
  state.alive = true;
  state.flags = {};
  state.log = "";
  play();
}

// =====================
// QTE SOURIS
// =====================
function qte(success, fail, time = 1200) {
  qteSound.currentTime = 0;
  qteSound.play();

  const size = 40;
  const x = Math.random() * (window.innerWidth - size);
  const y = Math.random() * (window.innerHeight - size);

  show(`
    <p>AGIS VITE</p>
    <div class="qte"
      style="left:${x}px; top:${y}px"
      onclick="go('${success}')">
    </div>
  `);

  setTimeout(() => {
    if (state.scene !== success) {
      go(fail);
    }
  }, time);
}

// =====================
// MORT
// =====================
function die(reason) {
  state.alive = false;
  show(`
    <h2>PERSONNAGE DÉCÉDÉ</h2>
    <p>${reason}</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

// =====================
// CERVEAU DU JEU
// =====================
function play() {
  if (!state.alive) return;

  if (state.scene === "menu") {
    menu();
    return;
  }

  if (state.character === "conrad") playConrad();
  if (state.character === "andrew") playAndrew();
  if (state.character === "rachel") playRachel();
  if (state.character === "kate") playKate();
}

// =====================
// HISTOIRES (PLACEHOLDERS)
// =====================
function playConrad() {
  show(`
    <h2>Conrad – Man of Medan</h2>
    <p>L’histoire sera ajoutée ici.</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

function playAndrew() {
  show(`
    <h2>Andrew – Little Hope</h2>
    <p>L’histoire sera ajoutée ici.</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

function playRachel() {
  show(`
    <h2>Rachel – House of Ashes</h2>
    <p>L’histoire sera ajoutée ici.</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

function playKate() {
  show(`
    <h2>Kate – The Devil In Me</h2>
    <p>L’histoire sera ajoutée ici.</p>
    <button onclick="state.scene='menu';menu()">Menu</button>
  `);
}

// =====================
menu();
</script>
</body>
</html>
